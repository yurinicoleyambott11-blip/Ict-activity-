<!DOCTYPE html>
<html>
<head>
<style>
div.gallery {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-start;
}

div.gallery-item {
  margin: 10px;
  border: 1px solid #ccc;
  width: 200px;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

div.gallery-item:hover {
  border: 1px solid #777;
  transform: scale(1.03);
}

div.gallery-item img {
  width: 100%;
  height: 150px;
  object-fit: cover;
  display: block;
}

div.gallery-item div.desc {
  padding: 15px;
  text-align: center;
  font-family: Arial, sans-serif;
  background-color: #f9f9f9;
}
</style>
</head>
<body>

<h2>Paradise Gallery</h2>

<div class="gallery">

  <div class="gallery-item">
    <a target="_blank" href="https://images.unsplash.com/photo-1507525428034-b723cf961d3e">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600" alt="Tropical Beach">
    </a>
    <div class="desc">Tropical Beach</div>
  </div>

  <div class="gallery-item">
    <a target="_blank" href="https://images.unsplash.com/photo-1510414842594-a61c69b5ae57">
      <img src="https://images.unsplash.com/photo-1510414842594-a61c69b5ae57?w=600" alt="Island Paradise">
    </a>
    <div class="desc">Island Paradise</div>
  </div>

  <div class="gallery-item">
    <a target="_blank" href="https://images.unsplash.com/photo-1544551763-46a013bb70d5">
      <img src="https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=600" alt="Palm Paradise">
    </a>
    <div class="desc">Palm Sunset</div>
  </div>

  <div class="gallery-item">
    <a target="_blank" href="https://images.unsplash.com/photo-1439066615861-d1af74d74000">
      <img src="https://images.unsplash.com/photo-1439066615861-d1af74d74000?w=600" alt="Maldives">
    </a>
    <div class="desc">Maldives View</div>
  </div>

</div>

</body>
</html>
